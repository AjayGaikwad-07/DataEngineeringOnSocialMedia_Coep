# docker-compose.yml
#
# Full stack for SocialMediaPipeline: Kafka + Postgres + Spark + Airflow.
#
# IMPORTANT: cursor already built part of this stack (Kafka healthy on
# 9092, Postgres healthy on 5434). Don't blindly overwrite that file —
# merge the `spark` and `airflow-*` services below into it, and reuse
# the existing kafka/zookeeper/postgres service definitions and network
# name so everything talks to each other correctly. Keep the working
# Postgres port mapping (5434:5432) as-is.

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [pipeline-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [pipeline-net]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socialmedia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"   # matches what's already running
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [pipeline-net]

  airflow-init:
    image: apache/airflow:2.9.3
    depends_on: [postgres]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@postgres:5432/socialmedia
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    networks: [pipeline-net]

  airflow-webserver:
    image: apache/airflow:2.9.3
    depends_on: [airflow-init]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@postgres:5432/socialmedia
    ports:
      - "8081:8080"
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    networks: [pipeline-net]

  airflow-scheduler:
    image: apache/airflow:2.9.3
    depends_on: [airflow-init]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@postgres:5432/socialmedia
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    networks: [pipeline-net]

  spark:
    image: apache/spark:latest
    ports:
      - "8082:8080"
      - "7077:7077"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    networks: [pipeline-net]

networks:
  pipeline-net:
    driver: bridge

volumes:
  pgdata:
